[tool.poetry]
name = "safebox-web"
version = "0.1.0"
description = "Minimal web interface and provider service boundary for Safebox Acorn"
authors = ["trbouma <trbouma@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.115,<0.116"
uvicorn = { version = ">=0.35,<1", extras = ["standard"] }
cryptography = ">=49,<50"
python-multipart = ">=0.0.20,<1"
jinja2 = ">=3.1,<4"
python-dotenv = ">=1,<2"
qrcode = ">=7.4,<9"
sqlmodel = ">=0.0.22,<0.1"
alembic = ">=1.14,<2"
bech32 = ">=1.2,<2"
bolt11 = ">=2.1,<3"
httpx = ">=0.28,<1"
monstr = ">=0.1.9,<0.2"
safebox-acorn = { git = "https://github.com/trbouma/safebox-acorn.git", branch = "main", extras = ["bitcoin"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<10"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"
pymdown-extensions = ">=10.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
