site_name: Safebox Web
site_description: A local-first wallet app for individuals and communities.
site_url: https://trbouma.github.io/safebox-web/
repo_url: https://github.com/trbouma/safebox-web
repo_name: trbouma/safebox-web

docs_dir: website
site_dir: site

theme:
  name: material
  language: en
  logo: assets/images/safebox-logo.png
  favicon: assets/images/safebox-logo.png
  features:
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: index.md
  - Understand Safebox Web:
      - Why Safebox Web?: why-safebox-web.md
      - Radical Rewrite of Architecture: radical-rewrite-of-architecture.md
      - Product Architecture: product-architecture.md
      - Trust Boundary: trust-boundary.md
  - Use Safebox Web:
      - Getting Started: getting-started.md
      - Local-First Stack: local-first-stack.md
  - Project Status: project-status.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

copyright: Safebox Web is open-source software released under the MIT License.
