services:
  safebox-web:
    image: ${SAFEBOX_IMAGE:-safebox-web:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safebox-web
    restart: unless-stopped
    init: true
    environment:
      SAFEBOX_COOKIE_KEY: "${SAFEBOX_COOKIE_KEY:?Generate SAFEBOX_COOKIE_KEY before starting}"
      SAFEBOX_SESSION_TTL_SECONDS: "${SAFEBOX_SESSION_TTL_SECONDS:-28800}"
      SAFEBOX_WALLET_LOAD_TIMEOUT_SECONDS: "${SAFEBOX_WALLET_LOAD_TIMEOUT_SECONDS:-20}"
      SAFEBOX_PAYMENT_TIMEOUT_SECONDS: "${SAFEBOX_PAYMENT_TIMEOUT_SECONDS:-90}"
      SAFEBOX_DEFAULT_BOOTSTRAP_RELAY: "${SAFEBOX_DEFAULT_BOOTSTRAP_RELAY:-wss://relay.getsafebox.app}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    ports:
      - "${SAFEBOX_BIND_ADDRESS:-127.0.0.1}:${SAFEBOX_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
