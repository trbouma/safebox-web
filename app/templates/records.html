{% extends "base.html" %}
{% block content %}
<p><a class="nav-button" href="/wallet">← Back to wallet</a></p>
<div class="record-actions">
  <a class="record-add" href="/record/edit">Add a Record</a>
</div>
{% if labels %}
<nav class="record-list" aria-label="Records">
  {% for record in labels %}
  <a class="record-list-item" href="{{ record.url }}">{{ record.label }}</a>
  {% endfor %}
</nav>
{% else %}
<p>No records were found.</p>
{% endif %}
<p><a class="nav-button" href="/wallet">Return to wallet</a></p>
{% endblock %}
