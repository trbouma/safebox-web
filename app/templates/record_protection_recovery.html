{% extends "base.html" %}
{% block content %}
<p class="error"><strong>Keep this phrase private.</strong></p>
<p>Protected record mnemonic:</p>
<pre>{{ recovery_phrase }}</pre>
<p>This mnemonic recovers the independent record protection key. It does not
recover the Acorn signing key, wallet funds, or relay location.</p>
<form method="post" action="/record-protection/confirm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>
    <input name="confirmed" type="checkbox" value="yes" required>
    I saved this separately labelled mnemonic offline.
  </label>
  <button type="submit">Confirm backup and return to wallet</button>
</form>
{% endblock %}
