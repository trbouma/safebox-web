{% extends "base.html" %}
{% block content %}
<p><a class="nav-button" href="/records">← Back to records</a></p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<p>The Original Record is protected by Acorn and stored separately from its
private record metadata.</p>
<p>Maximum file size: <strong>{{ max_blob_megabytes }} MiB</strong>.</p>
<form method="post" action="/blob/upload" enctype="multipart/form-data"
      autocomplete="off"
      data-progress-message="Protecting, storing, and verifying the Original Record. Please wait."
      data-progress-button="Storing Original Record…">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="label">Record label</label>
  <input id="label" name="label" type="text" maxlength="200" required
         value="{{ label }}">
  <label for="description">Description</label>
  <textarea id="description" name="description" maxlength="4000">{{ description }}</textarea>
  <label for="blob">Original Record</label>
  <input id="blob" name="blob" type="file" required>
  <label>
    <input type="checkbox" name="confirmed" value="yes" required>
    Protect and store this Original Record. Safebox processes the file during
    this request but does not retain an application copy.
  </label>
  <button type="submit">Store Original Record</button>
</form>
{% endblock %}
