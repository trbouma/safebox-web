<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151915">
  <title>{{ title }} · Safebox</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/theme.js" defer></script>
  <script src="/static/forms.js" defer></script>
</head>
<body>
  {% include "partials/relationship.html" %}
  <p id="page-progress" class="page-progress" role="status" aria-live="polite" hidden>Opening…</p>
  <main>
    {% if show_page_navigation %}
    <nav class="page-navigation" aria-label="Page navigation">
      <a class="nav-button" href="{{ home_url }}">Home</a>
      {% if page_back_url %}<a class="nav-button" href="{{ page_back_url }}">{{ page_back_label }}</a>{% endif %}
    </nav>
    {% endif %}
    <h1{% if headline_class %} class="{{ headline_class }}"{% endif %}>{{ title }}</h1>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
